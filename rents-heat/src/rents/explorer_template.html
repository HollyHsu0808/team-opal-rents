<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flat Rent Explorer</title>
<style>
:root { --bg:#f4f7f8; --panel:#fff; --ink:#14202b; --muted:#5b6874; --line:#d6e0e5; --navy:#0b2545; --teal:#13838f; --coral:#d9542f; --good:#1f8a4c; --warn:#b7791f; --bad:#c0392b; --tint:#e8f2f4;
  --display:"Cambria",Georgia,serif; --body:"Segoe UI",Calibri,Arial,sans-serif; --mono:Consolas,"Courier New",monospace; }
@media (prefers-color-scheme: dark) { :root { --bg:#0c1620; --panel:#13212d; --ink:#e6eef3; --muted:#9db0bd; --line:#2a3b48; --navy:#9fd3e6; --teal:#4fc0c9; --coral:#ff8a63; --tint:#182a37; --good:#4cc38a; --warn:#e0b04a; --bad:#ff7a6b; color-scheme: dark } }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 var(--body); padding:22px max(16px, 3vw) 40px; }
.wrap { max-width:1150px; margin:0 auto; display:grid; gap:16px; }
h1 { font-family:var(--display); color:var(--navy); margin:0; font-size:34px; }
.sub { color:var(--muted); margin:2px 0 0; }
.tabs { display:flex; gap:8px; flex-wrap:wrap; }
.tabs button, .btn { font:inherit; border:1px solid var(--line); background:var(--panel); color:var(--ink); padding:8px 14px; border-radius:8px; cursor:pointer; }
.tabs button[aria-pressed="true"] { background:var(--navy); color:var(--panel); border-color:var(--navy); font-weight:600; }
.btn.primary { background:var(--coral); border-color:var(--coral); color:#fff; font-weight:600; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
.search { display:flex; gap:8px; flex-wrap:wrap; }
.search input { flex:1; min-width:240px; font:inherit; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
.list { margin-top:10px; max-height:260px; overflow:auto; border:1px solid var(--line); border-radius:8px; }
.list div { padding:7px 10px; cursor:pointer; display:flex; justify-content:space-between; gap:10px; border-bottom:1px solid var(--line); }
.list div:hover, .list div.sel { background:var(--tint); }
.list small { color:var(--muted); white-space:nowrap; }
.cmp { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; margin-top:12px; }
.cmp div { border:1px solid var(--line); border-radius:10px; padding:12px; }
.cmp b { display:block; font-family:var(--display); font-size:34px; line-height:1.1; font-variant-numeric:tabular-nums; }
.cmp small { color:var(--muted); }
.actual b { color:var(--navy); } .pred b { color:var(--coral); }
.meta { color:var(--muted); margin-top:8px; }
.pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12.5px; font-weight:600; background:var(--tint); color:var(--teal); }
.stats { display:flex; gap:10px; flex-wrap:wrap; }
.stats span { font-family:var(--mono); font-size:13px; padding:3px 9px; border:1px solid var(--line); border-radius:999px; color:var(--muted); background:var(--panel); }
.note { font-size:12.5px; color:var(--muted); }
@media (max-width:700px) { .cmp { grid-template-columns:1fr; } }
</style></head><body>
<div class="wrap">
  <div><h1>Flat Rent Explorer</h1><p class="sub">Team-Opal · type any City of Sydney address and compare the advertised rent with our model. Local file — contains organiser data, not for publishing.</p></div>
  <div class="tabs"><button id="tHeld" aria-pressed="true">Held-out check: Jun–Jul 2026 adverts</button><button id="tAny" aria-pressed="false">Any flat (65,777)</button></div>
  <div class="panel">
    <div class="stats" id="stats"></div>
    <div class="search" style="margin-top:10px"><input id="q" placeholder="Type an address, e.g. 45 Shelley" autocomplete="off"><button class="btn primary" id="rnd">Random flat</button></div>
    <div class="list" id="list"></div>
  </div>
  <div class="panel" id="detail"></div>
  <p class="note" id="foot"></p>
</div>
<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const $ = id => document.getElementById(id);
let mode = "held", sel = null;
const money = v => v == null ? "–" : "$" + Math.round(v).toLocaleString("en-AU");
const bedTxt = b => b === 0 ? "studio" : b === 4 ? "4+ bed" : b + "-bed";
const errs = D.held.map(r => Math.abs(r[6] - r[7])).sort((a, b) => a - b);
const med = errs[Math.floor(errs.length / 2)], w100 = errs.filter(e => e <= 100).length / errs.length;
function rows() { return mode === "held" ? D.held : D.any; }
function label(r) { return mode === "held" ? `${r[1]}` : `${r[1]}`; }
function render() {
  $("stats").innerHTML = mode === "held"
    ? `<span>${D.held.length.toLocaleString()} adverts dated 1 Jun – 31 Jul 2026</span><span>model trained on adverts ≤ ${D.cutoffB} only</span><span>typical miss $${med.toFixed(0)}</span><span>${(w100 * 100).toFixed(1)}% within $100</span>`
    : `<span>${D.any.length.toLocaleString()} flats in the official input</span><span>submitted prediction (trained ≤ ${D.cutoff})</span><span>latest advert ≤ ${D.cutoff} shown as context</span>`;
  $("foot").textContent = mode === "held" ? "Held-out: these rents were never seen by the model that made the prediction — this is the honest test." : "Any flat: the latest advert shown was part of the training data, so it is context, not a test. The scored test is the organisers' Aug–Sep adverts.";
  search();
  if (sel) show(sel); else $("detail").innerHTML = "<p class='note'>Pick an address from the list or press Random flat.</p>";
}
function search() {
  const q = $("q").value.trim().toUpperCase().split(/\s+/).filter(Boolean);
  const R = rows(); const out = [];
  for (const r of R) { const a = r[1].toUpperCase(); if (q.every(t => a.includes(t))) { out.push(r); if (out.length >= 40) break; } }
  $("list").innerHTML = out.map((r, i) => `<div data-i="${i}"><span>${r[1]}</span><small>${r[2]} · ${bedTxt(r[3])}${mode === "held" ? " · " + r[5] : ""}</small></div>`).join("") || "<div><span>No match</span></div>";
  [...$("list").children].forEach((el, i) => el.onclick = () => { sel = out[i]; show(sel); });
}
function verdict(e) { return e <= 50 ? ["within $50", "var(--good)"] : e <= 100 ? ["within $100", "var(--warn)"] : ["off by more than $100", "var(--bad)"]; }
function show(r) {
  if (mode === "held") {
    const e = Math.abs(r[6] - r[7]), [vt, vc] = verdict(e);
    $("detail").innerHTML = `<h2 style="margin:0;font-family:var(--display)">${r[1]}</h2><div class="meta">${r[2]} · ${bedTxt(r[3])} · ${r[4] ? "with" : "without"} car space · advert dated ${r[5]}</div>
      <div class="cmp"><div class="actual"><small>Actual asking rent</small><b>${money(r[6])}</b><small>advertised ${r[5]}</small></div>
      <div class="pred"><small>Model prediction (trained ≤ ${D.cutoffB})</small><b>${money(r[7])}</b><small>${r[4] ? "with" : "without"} car space column</small></div>
      <div><small>Difference</small><b style="color:${vc}">${money(Math.abs(r[6] - r[7]))}</b><small style="color:${vc}">${vt}</small></div></div>
      <p class="meta">Evidence used: <span class="pill">${r[8]}</span></p>`;
  } else {
    const p = r[4] === 1 ? r[6] : r[7];
    $("detail").innerHTML = `<h2 style="margin:0;font-family:var(--display)">${r[1]}</h2><div class="meta">${r[2]} · ${bedTxt(r[3])}${r[5] != null ? " · level " + r[5] : ""} · input parking: ${r[4] == null ? "unknown" : r[4] ? "yes" : "no"}</div>
      <div class="cmp"><div class="pred"><small>Prediction with car space</small><b>${money(r[6])}</b></div><div class="pred"><small>Prediction without car space</small><b>${money(r[7])}</b></div>
      <div class="actual"><small>Latest advert ≤ ${D.cutoff} (in training)</small><b>${money(r[10])}</b><small>${r[9] || "never advertised"}</small></div></div>
      <p class="meta">Evidence used: <span class="pill">${r[8]}</span></p>`;
  }
}
$("q").oninput = search;
$("rnd").onclick = () => { const R = rows(); sel = R[Math.floor(Math.random() * R.length)]; $("q").value = ""; search(); show(sel); };
$("tHeld").onclick = () => { mode = "held"; sel = null; $("tHeld").setAttribute("aria-pressed", "true"); $("tAny").setAttribute("aria-pressed", "false"); render(); };
$("tAny").onclick = () => { mode = "any"; sel = null; $("tAny").setAttribute("aria-pressed", "true"); $("tHeld").setAttribute("aria-pressed", "false"); render(); };
render(); $("rnd").click();
</script></body></html>
